# Configuration for the Stale probot (https://github.com/probot/stale)
#
# Marks issues and pull requests as stale after a period of inactivity and
# closes them shortly after if no further activity occurs.

# Number of days of inactivity before an issue or PR is marked as stale.
daysUntilStale: 60

# Number of days of inactivity after being marked stale before it is closed.
daysUntilClose: 7

# Issues or PRs with these labels will never be considered stale.
exemptLabels:
  - pinned
  - security

# Label to use when marking an issue or PR as stale.
staleLabel: wontfix

# Comment to post when marking an issue or PR as stale.
markComment: >
  This issue has been automatically marked as stale because it has not had
  recent activity. It will be closed if no further activity occurs. Thank you
  for your contributions.

# Comment to post when closing a stale issue or PR.
closeComment: >
  This issue has been automatically closed because it has not had recent
  activity. Please reopen it if the problem persists or is still relevant.

# Limit the number of actions per hour, from 1-30. Default is 30.
limitPerRun: 30

# Limit to only issues or only pull requests.
# only: issues
# only: pulls
